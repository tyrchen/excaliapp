name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RELEASE_DIR: dist/github-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build Apple Silicon DMG
        run: npm run tauri -- build --bundles dmg --target aarch64-apple-darwin

      - name: Stage release asset
        run: |
          set -euo pipefail

          mkdir -p "$RELEASE_DIR"
          dmg_path="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/dmg" -maxdepth 1 -name "*.dmg" -print -quit)"
          test -n "$dmg_path"

          release_dmg="$RELEASE_DIR/ExcaliApp-${GITHUB_REF_NAME}-macos-arm64.dmg"
          cp "$dmg_path" "$release_dmg"
          echo "RELEASE_DMG=$release_dmg" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: excaliapp-macos-arm64-dmg
          path: ${{ env.RELEASE_DMG }}
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RELEASE_DIR: dist/github-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build Linux AppImage
        run: npm run tauri -- build --bundles appimage

      - name: Stage release asset
        run: |
          set -euo pipefail

          mkdir -p "$RELEASE_DIR"
          appimage_path="$(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -name "*.AppImage" -print -quit)"
          test -n "$appimage_path"

          release_appimage="$RELEASE_DIR/ExcaliApp-${GITHUB_REF_NAME}-linux-x86_64.AppImage"
          cp "$appimage_path" "$release_appimage"
          echo "RELEASE_APPIMAGE=$release_appimage" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: excaliapp-linux-x86_64-appimage
          path: ${{ env.RELEASE_APPIMAGE }}
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs:
      - build-macos
      - build-linux
    runs-on: ubuntu-24.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/github-release
          merge-multiple: true

      - name: List release artifacts
        run: find dist/github-release -maxdepth 1 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/github-release/*
          generate_release_notes: true
