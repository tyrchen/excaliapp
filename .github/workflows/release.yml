name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Build DMG and Create GitHub Release
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RELEASE_DIR: dist/github-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build Apple Silicon DMG
        run: npm run tauri -- build --bundles dmg --target aarch64-apple-darwin

      - name: Stage release asset
        run: |
          set -euo pipefail

          mkdir -p "$RELEASE_DIR"
          dmg_path="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/dmg" -maxdepth 1 -name "*.dmg" -print -quit)"
          test -n "$dmg_path"

          release_dmg="$RELEASE_DIR/ExcaliApp-${GITHUB_REF_NAME}-macos-arm64.dmg"
          cp "$dmg_path" "$release_dmg"
          echo "RELEASE_DMG=$release_dmg" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: excaliapp-macos-arm64-dmg
          path: ${{ env.RELEASE_DMG }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.RELEASE_DMG }}
          generate_release_notes: true
